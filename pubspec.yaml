name: sound_foundry
description: "Echo Bloom - Let your music bloom. High-performance offline-first music player."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State Management & Dependency Injection
  flutter_riverpod: ^2.6.1

  # Local SQLite Persistence & Path Resolution
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4+4
  sqflite_common_ffi_web: ^0.4.3+4
  path: ^1.9.1
  path_provider: ^2.1.5

  # Value Equality & Utilities
  equatable: ^2.0.7
  uuid: ^4.5.1
  permission_handler: 11.3.1
  image_picker: ^1.1.2
  http: ^1.6.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
